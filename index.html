<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>شطر - SHATR | Chess 960</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">
  <style>
    /* ==================== المتغيرات العامة ==================== */
    :root {
      --bg-deep: #07070b;
      --bg-dark: #0d0d14;
      --red-primary: #e63946;
      --red-glow: #ff4d5a;
      --red-dark: #a4161a;
      --white-soft: #f1f1f6;
      --white-dim: rgba(255,255,255,0.6);
      --glass-bg: rgba(255, 255, 255, 0.06);
      --glass-bg-hover: rgba(255, 255, 255, 0.12);
      --glass-border: rgba(255, 255, 255, 0.15);
      --glass-shadow: 0 8px 32px rgba(0, 0, 0, 0.5);
      --glass-blur: blur(24px) saturate(180%);
      --radius-lg: 28px;
      --radius-md: 18px;
      --radius-sm: 12px;
      --spring: cubic-bezier(0.34, 1.56, 0.64, 1);
      --font-ar: 'Cairo', sans-serif;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

    html, body {
      height: 100%;
      font-family: var(--font-ar);
      background: var(--bg-deep);
      color: var(--white-soft);
      overflow: hidden;
      overscroll-behavior: none;
    }

    /* ==================== الخلفية ==================== */
    .bg-scene {
      position: fixed; inset: 0; z-index: -2;
      background:
        radial-gradient(ellipse 80% 60% at 20% 10%, rgba(230, 57, 70, 0.18) 0%, transparent 60%),
        radial-gradient(ellipse 60% 50% at 85% 85%, rgba(164, 22, 26, 0.15) 0%, transparent 60%),
        radial-gradient(ellipse 50% 40% at 50% 50%, rgba(255, 77, 90, 0.06) 0%, transparent 70%),
        linear-gradient(160deg, #07070b 0%, #0f0f18 40%, #120a0c 100%);
    }
    .bg-orb {
      position: fixed; border-radius: 50%; filter: blur(120px); z-index: -1; opacity: 0.5;
      animation: floatOrb 12s ease-in-out infinite alternate;
    }
    .bg-orb.a { width: 500px; height: 500px; background: rgba(230,57,70,0.2); top: -15%; left: -10%; }
    .bg-orb.b { width: 400px; height: 400px; background: rgba(255,255,255,0.05); bottom: -10%; right: -8%; animation-delay: -4s; }
    @keyframes floatOrb {
      0% { transform: translate(0,0) scale(1); }
      100% { transform: translate(40px, -30px) scale(1.1); }
    }

    /* ==================== الهيكل ==================== */
    .app {
      display: flex; flex-direction: column; height: 100dvh; max-height: 100dvh;
      padding: 12px; gap: 12px; overflow: hidden;
    }

    /* ==================== الزجاج ==================== */
    .glass {
      background: var(--glass-bg);
      backdrop-filter: var(--glass-blur);
      -webkit-backdrop-filter: var(--glass-blur);
      border: 1px solid var(--glass-border);
      box-shadow: var(--glass-shadow), inset 0 1px 0 rgba(255,255,255,0.12);
      border-radius: var(--radius-lg);
    }
    .glass-sm {
      background: var(--glass-bg);
      backdrop-filter: blur(16px) saturate(160%);
      -webkit-backdrop-filter: blur(16px) saturate(160%);
      border: 1px solid var(--glass-border);
      box-shadow: 0 4px 20px rgba(0,0,0,0.35), inset 0 1px 0 rgba(255,255,255,0.1);
      border-radius: var(--radius-md);
    }

    /* ==================== الترويسة ==================== */
    .header {
      display: flex; align-items: center; justify-content: space-between;
      padding: 10px 18px; flex-shrink: 0; gap: 10px;
    }
    .logo {
      display: flex; align-items: center; gap: 10px;
      font-weight: 900; font-size: 22px; letter-spacing: 1px;
    }
    .logo-icon {
      width: 38px; height: 38px; border-radius: 12px;
      background: linear-gradient(135deg, var(--red-primary), var(--red-dark));
      display: flex; align-items: center; justify-content: center;
      font-size: 22px; box-shadow: 0 4px 16px rgba(230,57,70,0.4);
      transition: transform 0.3s var(--spring);
    }
    .logo-icon:hover { transform: scale(1.1) rotate(-5deg); }
    .logo-text { background: linear-gradient(135deg, #fff 0%, #ffb3b3 100%); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
    .header-actions { display: flex; gap: 8px; }

    .icon-btn {
      width: 44px; height: 44px; border-radius: 14px;
      background: var(--glass-bg); backdrop-filter: blur(16px);
      border: 1px solid var(--glass-border);
      color: var(--white-soft); font-size: 20px; cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      transition: all 0.25s var(--spring);
      position: relative; overflow: hidden;
    }
    .icon-btn:hover { background: var(--glass-bg-hover); transform: scale(1.08); }
    .icon-btn:active { transform: scale(0.92); }
    .icon-btn.red { background: rgba(230,57,70,0.2); border-color: rgba(230,57,70,0.35); }
    .icon-btn.red:hover { background: rgba(230,57,70,0.35); box-shadow: 0 0 20px rgba(230,57,70,0.3); }

    /* ==================== المحتوى الرئيسي ==================== */
    .main {
      display: flex; flex: 1; gap: 12px; min-height: 0; overflow: hidden;
    }

    /* ==================== الرقعة ==================== */
    .board-area {
      flex: 1; display: flex; flex-direction: column;
      align-items: center; justify-content: center; min-width: 0; min-height: 0;
      padding: 10px;
    }
    .board-wrapper {
      width: min(100%, 72vh, 620px); aspect-ratio: 1/1;
      border-radius: var(--radius-lg); overflow: hidden;
      position: relative; padding: 8px;
      transition: box-shadow 0.3s;
    }
    .board-wrapper.in-check { box-shadow: 0 0 0 2px var(--red-primary), 0 0 40px rgba(230,57,70,0.4); }

    .chess-board {
      display: grid; grid-template-columns: repeat(8, 1fr); grid-template-rows: repeat(8, 1fr);
      width: 100%; height: 100%; border-radius: var(--radius-md); overflow: hidden;
      direction: ltr;
    }
    .square {
      position: relative; display: flex; align-items: center; justify-content: center;
      cursor: pointer; user-select: none;
      transition: background 0.15s;
    }
    .square.light { background: rgba(255,255,255,0.09); }
    .square.dark { background: rgba(230,57,70,0.12); }
    .square.light:hover, .square.dark:hover { background: rgba(255,255,255,0.2); }

    .square.selected { background: rgba(255, 200, 100, 0.35) !important; box-shadow: inset 0 0 0 2px rgba(255,200,100,0.6); }
    .square.legal-move::after {
      content: ''; position: absolute; width: 28%; height: 28%; border-radius: 50%;
      background: rgba(80, 220, 120, 0.7); box-shadow: 0 0 12px rgba(80,220,120,0.5);
      pointer-events: none;
    }
    .square.legal-move.capture::after {
      width: 70%; height: 70%; background: transparent;
      border: 3px solid rgba(80, 220, 120, 0.7); border-radius: 50%; box-shadow: 0 0 16px rgba(80,220,120,0.3);
    }
    .square.last-move { background: rgba(255, 200, 100, 0.15) !important; }
    .square.check-king { animation: checkPulse 0.8s ease-in-out infinite; }
    @keyframes checkPulse {
      0%, 100% { box-shadow: inset 0 0 0 3px rgba(255,50,50,0.8); }
      50% { box-shadow: inset 0 0 0 6px rgba(255,50,50,1), 0 0 25px rgba(255,50,50,0.6); }
    }

    .piece {
      font-size: clamp(28px, 6vw, 54px); line-height: 1;
      text-shadow: 0 2px 8px rgba(0,0,0,0.5);
      transition: transform 0.2s var(--spring);
      pointer-events: none; z-index: 2;
    }
    .piece.white { color: #ffffff; filter: drop-shadow(0 2px 4px rgba(0,0,0,0.6)); }
    .piece.black { color: #1a1a24; filter: drop-shadow(0 2px 4px rgba(255,255,255,0.15)); }
    .square:hover .piece { transform: scale(1.1); }

    /* ==================== الشريط الجانبي ==================== */
    .sidebar {
      width: 280px; display: flex; flex-direction: column; gap: 12px;
      flex-shrink: 0; overflow: hidden;
    }
    .panel { padding: 16px; display: flex; flex-direction: column; gap: 10px; }
    .panel-title {
      font-size: 14px; font-weight: 700; color: var(--white-dim);
      text-transform: uppercase; letter-spacing: 1px;
      display: flex; align-items: center; gap: 8px;
    }
    .panel-title::before {
      content: ''; width: 4px; height: 16px; border-radius: 2px;
      background: linear-gradient(180deg, var(--red-primary), var(--red-dark));
    }

    .status-badge {
      display: flex; align-items: center; gap: 10px;
      padding: 10px 14px; border-radius: var(--radius-sm);
      background: rgba(230,57,70,0.12); border: 1px solid rgba(230,57,70,0.25);
      font-weight: 700; font-size: 14px;
    }
    .status-dot { width: 10px; height: 10px; border-radius: 50%; background: var(--red-primary); box-shadow: 0 0 10px var(--red-primary); animation: pulseDot 1.5s infinite; }
    @keyframes pulseDot { 0%,100%{opacity:1} 50%{opacity:0.4} }

    .stats-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
    .stat-item {
      padding: 10px; border-radius: var(--radius-sm);
      background: rgba(255,255,255,0.04); border: 1px solid rgba(255,255,255,0.06);
      text-align: center;
    }
    .stat-value { font-size: 22px; font-weight: 900; color: var(--red-glow); }
    .stat-label { font-size: 11px; color: var(--white-dim); margin-top: 2px; }

    .move-list {
      flex: 1; overflow-y: auto; display: flex; flex-direction: column; gap: 3px;
      padding-right: 4px; max-height: 200px;
    }
    .move-list::-webkit-scrollbar { width: 4px; }
    .move-list::-webkit-scrollbar-thumb { background: rgba(230,57,70,0.4); border-radius: 2px; }
    .move-row { display: flex; gap: 6px; font-size: 13px; padding: 5px 8px; border-radius: 6px; }
    .move-row:nth-child(odd) { background: rgba(255,255,255,0.03); }
    .move-num { color: var(--white-dim); min-width: 24px; font-weight: 600; }
    .move-san { color: var(--white-soft); font-weight: 600; }

    /* ==================== الشريط السفلي ==================== */
    .bottom-bar {
      display: flex; gap: 8px; padding: 10px; flex-shrink: 0;
      justify-content: center; flex-wrap: wrap;
    }
    .btn {
      padding: 10px 20px; border-radius: 14px; border: 1px solid var(--glass-border);
      background: var(--glass-bg); backdrop-filter: blur(16px);
      color: var(--white-soft); font-family: var(--font-ar); font-weight: 700; font-size: 14px;
      cursor: pointer; transition: all 0.25s var(--spring);
      display: flex; align-items: center; gap: 8px;
    }
    .btn:hover { background: var(--glass-bg-hover); transform: translateY(-2px) scale(1.03); }
    .btn:active { transform: scale(0.95); }
    .btn.primary { background: linear-gradient(135deg, var(--red-primary), var(--red-dark)); border-color: rgba(255,255,255,0.2); box-shadow: 0 4px 20px rgba(230,57,70,0.35); }
    .btn.primary:hover { box-shadow: 0 6px 28px rgba(230,57,70,0.5); }

    /* ==================== النوافذ المنبثقة ==================== */
    .modal-overlay {
      position: fixed; inset: 0; z-index: 100;
      background: rgba(0,0,0,0.6); backdrop-filter: blur(10px);
      display: flex; align-items: center; justify-content: center;
      opacity: 0; pointer-events: none; transition: opacity 0.3s;
    }
    .modal-overlay.active { opacity: 1; pointer-events: auto; }
    .modal {
      width: min(90%, 480px); max-height: 80vh; overflow-y: auto;
      padding: 24px; transform: scale(0.9) translateY(20px);
      transition: transform 0.35s var(--spring);
    }
    .modal-overlay.active .modal { transform: scale(1) translateY(0); }
    .modal h2 { font-size: 20px; margin-bottom: 16px; display: flex; align-items: center; gap: 10px; }
    .modal-close {
      position: absolute; top: 14px; left: 14px; /* RTL: left */
      width: 34px; height: 34px; border-radius: 10px; border: 1px solid var(--glass-border);
      background: rgba(255,255,255,0.06); color: var(--white-soft); cursor: pointer;
      font-size: 18px; display: flex; align-items: center; justify-content: center;
      transition: 0.2s;
    }
    .modal-close:hover { background: rgba(230,57,70,0.3); }
    [dir="ltr"] .modal-close { left: auto; right: 14px; }

    .settings-group { margin-bottom: 20px; }
    .settings-label { font-size: 13px; color: var(--white-dim); margin-bottom: 8px; font-weight: 600; }
    .toggle-row {
      display: flex; align-items: center; justify-content: space-between;
      padding: 12px 14px; border-radius: var(--radius-sm);
      background: rgba(255,255,255,0.04); border: 1px solid rgba(255,255,255,0.06);
      margin-bottom: 8px;
    }
    .toggle-switch {
      width: 48px; height: 28px; border-radius: 14px; border: none;
      background: rgba(255,255,255,0.15); cursor: pointer; position: relative;
      transition: background 0.3s;
    }
    .toggle-switch.on { background: var(--red-primary); }
    .toggle-switch::after {
      content: ''; position: absolute; top: 3px; left: 3px;
      width: 22px; height: 22px; border-radius: 50%; background: white;
      transition: transform 0.3s var(--spring);
    }
    .toggle-switch.on::after { transform: translateX(20px); }
    [dir="ltr"] .toggle-switch::after { left: auto; right: 3px; }
    [dir="ltr"] .toggle-switch.on::after { transform: translateX(-20px); }

    /* ==================== شاشة النهاية ==================== */
    .game-over-screen {
      position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
      background: rgba(0,0,0,0.7); backdrop-filter: blur(8px); border-radius: var(--radius-lg);
      opacity: 0; pointer-events: none; transition: opacity 0.4s; z-index: 10;
    }
    .game-over-screen.active { opacity: 1; pointer-events: auto; }
    .game-over-content { text-align: center; padding: 30px; }
    .game-over-title { font-size: 32px; font-weight: 900; color: var(--red-glow); margin-bottom: 8px; }
    .game-over-sub { font-size: 16px; color: var(--white-dim); margin-bottom: 20px; }

    /* ==================== الترجمة (إخفاء) ==================== */
    [data-i18n] { transition: opacity 0.2s; }

    /* ==================== استجابة ==================== */
    @media (max-width: 860px) {
      .sidebar { display: none; }
      .board-wrapper { width: min(100%, 92vw, 500px); }
      .header { padding: 8px 12px; }
      .logo { font-size: 18px; }
    }
    @media (max-width: 480px) {
      .app { padding: 8px; gap: 8px; }
      .bottom-bar { gap: 6px; padding: 8px; }
      .btn { padding: 8px 14px; font-size: 12px; }
    }

    /* ==================== RTL / LTR ==================== */
    [dir="rtl"] .sidebar { order: -1; }
    [dir="ltr"] .sidebar { order: 1; }
  </style>
</head>
<body>
  <div class="bg-scene"></div>
  <div class="bg-orb a"></div>
  <div class="bg-orb b"></div>

  <div class="app">
    <!-- الترويسة -->
    <header class="header glass">
      <div class="logo">
        <div class="logo-icon">♛</div>
        <span class="logo-text" data-i18n="appName">شطر</span>
      </div>
      <div class="header-actions">
        <button class="icon-btn" id="btnStats" title="الإحصائيات" data-i18n-title="stats">📊</button>
        <button class="icon-btn" id="btnSettings" title="الإعدادات" data-i18n-title="settings">⚙️</button>
        <button class="icon-btn red" id="btnNewGame" title="لعبة جديدة" data-i18n-title="newGame">🔄</button>
      </div>
    </header>

    <!-- المحتوى -->
    <div class="main">
      <!-- الرقعة -->
      <div class="board-area">
        <div class="board-wrapper glass" id="boardWrapper">
          <div class="chess-board" id="board"></div>
          <div class="game-over-screen" id="gameOverScreen">
            <div class="game-over-content glass-sm">
              <div class="game-over-title" id="gameOverTitle">كش مات!</div>
              <div class="game-over-sub" id="gameOverSub">فاز الأبيض</div>
              <button class="btn primary" id="btnPlayAgain" data-i18n="playAgain">العب مرة أخرى</button>
            </div>
          </div>
        </div>
      </div>

      <!-- الشريط الجانبي -->
      <aside class="sidebar">
        <div class="panel glass-sm">
          <div class="panel-title" data-i18n="gameStatus">حالة اللعبة</div>
          <div class="status-badge" id="statusBadge">
            <div class="status-dot"></div>
            <span id="statusText" data-i18n="whiteTurn">دور الأبيض</span>
          </div>
          <div class="stats-grid">
            <div class="stat-item">
              <div class="stat-value" id="statMoves">0</div>
              <div class="stat-label" data-i18n="moves">النقلات</div>
            </div>
            <div class="stat-item">
              <div class="stat-value" id="statPosition">0</div>
              <div class="stat-label" data-i18n="positionId">رقم الموقع</div>
            </div>
          </div>
        </div>

        <div class="panel glass-sm" style="flex:1; min-height:0;">
          <div class="panel-title" data-i18n="moveHistory">سجل النقلات</div>
          <div class="move-list" id="moveList"></div>
        </div>
      </aside>
    </div>

    <!-- الشريط السفلي -->
    <div class="bottom-bar">
      <button class="btn" id="btnFlip" data-i18n="flip">🔄 قلب الرقعة</button>
      <button class="btn" id="btnUndo" data-i18n="undo">↩️ تراجع</button>
      <button class="btn primary" id="btnNewRandom" data-i18n="newRandom">🎲 موقع عشوائي</button>
    </div>
  </div>

  <!-- نافذة الإعدادات -->
  <div class="modal-overlay" id="settingsModal">
    <div class="modal glass">
      <button class="modal-close" id="btnCloseSettings">✕</button>
      <h2><span>⚙️</span> <span data-i18n="settings">الإعدادات</span></h2>
      <div class="settings-group">
        <div class="settings-label" data-i18n="language">اللغة</div>
        <div class="toggle-row">
          <span data-i18n="arabic">العربية</span>
          <button class="toggle-switch on" id="langToggle"></button>
        </div>
      </div>
      <div class="settings-group">
        <div class="settings-label" data-i18n="boardTheme">سمة الرقعة</div>
        <div class="toggle-row">
          <span data-i18n="redWhite">أحمر / أبيض</span>
          <span style="color:var(--red-glow);">●</span>
        </div>
      </div>
      <div class="settings-group">
        <div class="settings-label" data-i18n="sound">المؤثرات الصوتية</div>
        <div class="toggle-row">
          <span data-i18n="soundOn">مفعّلة</span>
          <button class="toggle-switch on" id="soundToggle"></button>
        </div>
      </div>
      <div class="settings-group">
        <div class="settings-label" data-i18n="positionId">رقم الموقع (0-959)</div>
        <div style="display:flex; gap:8px;">
          <input type="number" id="posInput" min="0" max="959" value="518"
                 style="flex:1; padding:10px; border-radius:10px; border:1px solid var(--glass-border); background:rgba(255,255,255,0.06); color:white; font-family:var(--font-ar); font-size:14px;">
          <button class="btn" id="btnLoadPos" data-i18n="load">تحميل</button>
        </div>
      </div>
    </div>
  </div>

  <!-- نافذة الإحصائيات -->
  <div class="modal-overlay" id="statsModal">
    <div class="modal glass">
      <button class="modal-close" id="btnCloseStats">✕</button>
      <h2><span>📊</span> <span data-i18n="statistics">الإحصائيات</span></h2>
      <div class="stats-grid" style="grid-template-columns:1fr 1fr 1fr;">
        <div class="stat-item">
          <div class="stat-value" id="statsTotal">0</div>
          <div class="stat-label" data-i18n="totalMoves">إجمالي النقلات</div>
        </div>
        <div class="stat-item">
          <div class="stat-value" id="statsWhite">0</div>
          <div class="stat-label" data-i18n="whiteMoves">نقلات الأبيض</div>
        </div>
        <div class="stat-item">
          <div class="stat-value" id="statsBlack">0</div>
          <div class="stat-label" data-i18n="blackMoves">نقلات الأسود</div>
        </div>
      </div>
      <div style="margin-top:20px;">
        <div class="panel-title" data-i18n="currentPosition">الموقع الحالي (FEN)</div>
        <div style="margin-top:8px; padding:12px; border-radius:12px; background:rgba(0,0,0,0.3); font-size:12px; word-break:break-all; color:var(--white-dim);" id="statsFen">-</div>
      </div>
    </div>
  </div>

  <!-- نافذة الترقية -->
  <div class="modal-overlay" id="promotionModal">
    <div class="modal glass" style="width:auto; padding:20px;">
      <h2 data-i18n="promotion">اختر قطعة الترقية</h2>
      <div style="display:flex; gap:12px; justify-content:center; margin-top:16px;">
        <button class="promo-btn" data-piece="q" style="font-size:40px; background:none; border:none; color:white; cursor:pointer;">♕</button>
        <button class="promo-btn" data-piece="r" style="font-size:40px; background:none; border:none; color:white; cursor:pointer;">♖</button>
        <button class="promo-btn" data-piece="b" style="font-size:40px; background:none; border:none; color:white; cursor:pointer;">♗</button>
        <button class="promo-btn" data-piece="n" style="font-size:40px; background:none; border:none; color:white; cursor:pointer;">♘</button>
      </div>
    </div>
  </div>

  <script type="module">
    /* ==================== استيراد محرك الشطرنج 960 ==================== */
    import {
      fromFen,
      toFen,
      getLegalMoves,
      makeMove,
      toSan,
      isCheck,
      isCheckmate,
      isStalemate,
      getGameResult,
      chess960StartingFen,
      randomChess960Fen
    } from 'https://cdn.jsdelivr.net/npm/@pech/chess-core/+esm';

    /* ==================== الحالة العامة ==================== */
    const state = {
      position: null,          // كائن Position الحالي
      fen: '',                 // FEN الحالي
      history: [],             // قائمة FEN أو تجزئات
      moveHistory: [],         // قائمة SAN
      selectedSquare: null,    // المربع المحدد
      legalMoves: [],          // الحركات القانونية من المربع المحدد
      orientation: 'white',    // اتجاه الرقعة
      lastMove: null,          // آخر نقلة { from, to }
      gameOver: false,
      positionId: 518,         // رقم Scharnagl
      soundEnabled: true,
      lang: 'ar',
      moveCount: 0,
      whiteMoves: 0,
      blackMoves: 0
    };

    /* ==================== الترجمة ==================== */
    const i18n = {
      ar: {
        appName: 'شطر',
        newGame: 'لعبة جديدة',
        settings: 'الإعدادات',
        stats: 'الإحصائيات',
        statistics: 'الإحصائيات',
        gameStatus: 'حالة اللعبة',
        whiteTurn: 'دور الأبيض',
        blackTurn: 'دور الأسود',
        moves: 'النقلات',
        positionId: 'رقم الموقع',
        moveHistory: 'سجل النقلات',
        flip: '🔄 قلب الرقعة',
        undo: '↩️ تراجع',
        newRandom: '🎲 موقع عشوائي',
        playAgain: 'العب مرة أخرى',
        language: 'اللغة',
        arabic: 'العربية',
        english: 'English',
        boardTheme: 'سمة الرقعة',
        redWhite: 'أحمر / أبيض',
        sound: 'المؤثرات الصوتية',
        soundOn: 'مفعّلة',
        soundOff: 'معطّلة',
        load: 'تحميل',
        totalMoves: 'إجمالي النقلات',
        whiteMoves: 'نقلات الأبيض',
        blackMoves: 'نقلات الأسود',
        currentPosition: 'الموقع الحالي (FEN)',
        promotion: 'اختر قطعة الترقية',
        check: 'كش!',
        checkmate: 'كش مات!',
        stalemate: 'تعادل - طريق مسدود',
        whiteWins: 'فاز الأبيض',
        blackWins: 'فاز الأسود',
        draw: 'تعادل',
        invalidMove: 'نقلة غير قانونية'
      },
      en: {
        appName: 'SHATR',
        newGame: 'New Game',
        settings: 'Settings',
        stats: 'Statistics',
        statistics: 'Statistics',
        gameStatus: 'Game Status',
        whiteTurn: "White's Turn",
        blackTurn: "Black's Turn",
        moves: 'Moves',
        positionId: 'Position ID',
        moveHistory: 'Move History',
        flip: '🔄 Flip Board',
        undo: '↩️ Undo',
        newRandom: '🎲 Random Position',
        playAgain: 'Play Again',
        language: 'Language',
        arabic: 'العربية',
        english: 'English',
        boardTheme: 'Board Theme',
        redWhite: 'Red / White',
        sound: 'Sound Effects',
        soundOn: 'On',
        soundOff: 'Off',
        load: 'Load',
        totalMoves: 'Total Moves',
        whiteMoves: 'White Moves',
        blackMoves: 'Black Moves',
        currentPosition: 'Current Position (FEN)',
        promotion: 'Choose Promotion',
        check: 'Check!',
        checkmate: 'Checkmate!',
        stalemate: 'Stalemate',
        whiteWins: 'White Wins',
        blackWins: 'Black Wins',
        draw: 'Draw',
        invalidMove: 'Invalid move'
      }
    };

    /* ==================== عناصر DOM ==================== */
    const boardEl = document.getElementById('board');
    const boardWrapper = document.getElementById('boardWrapper');
    const statusText = document.getElementById('statusText');
    const statMoves = document.getElementById('statMoves');
    const statPosition = document.getElementById('statPosition');
    const moveListEl = document.getElementById('moveList');
    const gameOverScreen = document.getElementById('gameOverScreen');
    const gameOverTitle = document.getElementById('gameOverTitle');
    const gameOverSub = document.getElementById('gameOverSub');

    /* ==================== رموز القطع ==================== */
    const PIECE_UNICODE = {
      'r': '♜', 'n': '♞', 'b': '♝', 'q': '♛', 'k': '♚', 'p': '♟',
      'R': '♖', 'N': '♘', 'B': '♗', 'Q': '♕', 'K': '♔', 'P': '♙'
    };

    /* ==================== دوال مساعدة ==================== */
    function t(key) {
      return i18n[state.lang][key] || key;
    }

    function updateI18n() {
      document.querySelectorAll('[data-i18n]').forEach(el => {
        const key = el.getAttribute('data-i18n');
        if (i18n[state.lang][key]) el.textContent = i18n[state.lang][key];
      });
      document.querySelectorAll('[data-i18n-title]').forEach(el => {
        const key = el.getAttribute('data-i18n-title');
        if (i18n[state.lang][key]) el.title = i18n[state.lang][key];
      });
      document.documentElement.lang = state.lang;
      document.documentElement.dir = state.lang === 'ar' ? 'rtl' : 'ltr';
      // تحديث حالة اللعبة بعد تغيير اللغة
      updateStatus();
    }

    /* ==================== تحليل FEN إلى مصفوفة ==================== */
    function fenToBoard(fen) {
      const [placement] = fen.split(' ');
      const rows = placement.split('/');
      const board = [];
      for (let r = 0; r < 8; r++) {
        const row = [];
        for (const ch of rows[r]) {
          if (/\d/.test(ch)) {
            for (let i = 0; i < parseInt(ch); i++) row.push(null);
          } else {
            row.push(ch);
          }
        }
        board.push(row);
      }
      return board; // board[0] = الرتبة 8، board[7] = الرتبة 1
    }

    /* ==================== عرض الرقعة ==================== */
    function renderBoard() {
      const fen = state.fen;
      if (!fen) return;
      const boardData = fenToBoard(fen);
      boardEl.innerHTML = '';

      // تحديد الاتجاه
      const isWhiteOrientation = state.orientation === 'white';
      const rankOrder = isWhiteOrientation ? [0,1,2,3,4,5,6,7] : [7,6,5,4,3,2,1,0];
      const fileOrder = isWhiteOrientation ? [0,1,2,3,4,5,6,7] : [7,6,5,4,3,2,1,0];

      // البحث عن الملك في حالة كش
      let checkSquare = null;
      if (state.position && isCheck(state.position)) {
        const turn = getTurn(state.position);
        const kingChar = turn === 'w' ? 'K' : 'k';
        for (let r = 0; r < 8; r++) {
          for (let c = 0; c < 8; c++) {
            if (boardData[r][c] === kingChar) {
              checkSquare = { row: r, col: c };
            }
          }
        }
      }

      for (const r of rankOrder) {
        for (const c of fileOrder) {
          const square = document.createElement('div');
          const isLight = (r + c) % 2 === 0;
          square.className = `square ${isLight ? 'light' : 'dark'}`;
          square.dataset.row = r;
          square.dataset.col = c;
          square.dataset.square = String.fromCharCode(97 + c) + (8 - r);

          // إضافة مؤشرات
          if (state.lastMove) {
            if (state.lastMove.from === square.dataset.square || state.lastMove.to === square.dataset.square) {
              square.classList.add('last-move');
            }
          }
          if (state.selectedSquare === square.dataset.square) {
            square.classList.add('selected');
          }
          if (checkSquare && checkSquare.row === r && checkSquare.col === c) {
            square.classList.add('check-king');
          }

          // إضافة القطعة
          const piece = boardData[r][c];
          if (piece) {
            const span = document.createElement('span');
            span.className = `piece ${piece === piece.toUpperCase() ? 'white' : 'black'}`;
            span.textContent = PIECE_UNICODE[piece] || '';
            square.appendChild(span);
          }

          // النقاط القانونية
          if (state.selectedSquare) {
            const isLegal = state.legalMoves.some(m => m.from === state.selectedSquare && m.to === square.dataset.square);
            if (isLegal) {
              square.classList.add('legal-move');
              if (piece) square.classList.add('capture');
            }
          }

          square.addEventListener('click', () => onSquareClick(square.dataset.square));
          boardEl.appendChild(square);
        }
      }

      // تحديث FEN في الإحصائيات
      const statsFen = document.getElementById('statsFen');
      if (statsFen) statsFen.textContent = state.fen;
    }

    /* ==================== الحصول على الدور ==================== */
    function getTurn(pos) {
      // @pech/chess-core يستخدم 'w' / 'b' في FEN
      const fen = toFen(pos);
      return fen.split(' ')[1]; // 'w' أو 'b'
    }

    /* ==================== معالجة النقر على مربع ==================== */
    function onSquareClick(square) {
      if (state.gameOver) return;
      const pos = state.position;
      if (!pos) return;

      const turn = getTurn(pos);
      const playerColor = turn === 'w' ? 'white' : 'black';

      // إذا كان هناك مربع محدد مسبقًا
      if (state.selectedSquare) {
        // محاولة تنفيذ نقلة
        const move = state.legalMoves.find(m => m.from === state.selectedSquare && m.to === square);
        if (move) {
          // التحقق من الترقية
          const isPromotion = move.promotion && move.promotion !== '';
          if (isPromotion) {
            showPromotionModal(move);
            return;
          }
          executeMove(move);
          return;
        }
      }

      // تحديد قطعة جديدة
      const boardData = fenToBoard(state.fen);
      const row = 8 - parseInt(square[1]);
      const col = square.charCodeAt(0) - 97;
      const piece = boardData[row]?.[col];
      if (piece) {
        const pieceColor = piece === piece.toUpperCase() ? 'white' : 'black';
        if (pieceColor === playerColor) {
          state.selectedSquare = square;
          state.legalMoves = getLegalMoves(pos).filter(m => m.from === square);
          renderBoard();
        } else {
          // النقر على قطعة خصم: إلغاء التحديد
          state.selectedSquare = null;
          state.legalMoves = [];
          renderBoard();
        }
      } else {
        // النقر على مربع فارغ: إلغاء التحديد
        state.selectedSquare = null;
        state.legalMoves = [];
        renderBoard();
      }
    }

    /* ==================== نافذة الترقية ==================== */
    let pendingPromotionMove = null;
    function showPromotionModal(move) {
      pendingPromotionMove = move;
      document.getElementById('promotionModal').classList.add('active');
    }

    document.querySelectorAll('.promo-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        const piece = btn.dataset.piece;
        if (pendingPromotionMove) {
          // العثور على الحركة مع الترقية المحددة
          const pos = state.position;
          const moves = getLegalMoves(pos).filter(m =>
            m.from === pendingPromotionMove.from &&
            m.to === pendingPromotionMove.to &&
            m.promotion === piece
          );
          if (moves.length > 0) {
            executeMove(moves[0]);
          }
        }
        document.getElementById('promotionModal').classList.remove('active');
        pendingPromotionMove = null;
      });
    });

    /* ==================== تنفيذ نقلة ==================== */
    function executeMove(move) {
      const pos = state.position;
      const san = toSan(pos, move);
      const newPos = makeMove(pos, move);
      const newFen = toFen(newPos);

      // تحديث الحالة
      state.position = newPos;
      state.fen = newFen;
      state.history.push(newFen);
      state.moveHistory.push(san);
      state.lastMove = { from: move.from, to: move.to };
      state.selectedSquare = null;
      state.legalMoves = [];
      state.moveCount++;

      // إحصائيات
      const turn = getTurn(pos);
      if (turn === 'w') state.whiteMoves++;
      else state.blackMoves++;

      // تحديث الواجهة
      renderBoard();
      updateStatus();
      updateMoveList();
      updateStats();

      // التحقق من نهاية اللعبة
      checkGameOver(newPos);

      // صوت (اختياري)
      if (state.soundEnabled) playMoveSound();
    }

    /* ==================== التراجع ==================== */
    function undoMove() {
      if (state.history.length <= 1) return;
      state.history.pop();
      state.moveHistory.pop();
      const prevFen = state.history[state.history.length - 1];
      state.fen = prevFen;
      state.position = fromFen(prevFen);
      state.selectedSquare = null;
      state.legalMoves = [];
      state.gameOver = false;
      gameOverScreen.classList.remove('active');
      if (state.moveCount > 0) state.moveCount--;
      renderBoard();
      updateStatus();
      updateMoveList();
      updateStats();
    }

    /* ==================== تحديث الحالة ==================== */
    function updateStatus() {
      if (!state.position) return;
      const turn = getTurn(state.position);
      const isInCheck = isCheck(state.position);

      if (isCheckmate(state.position)) {
        const winner = turn === 'w' ? 'black' : 'white';
        statusText.textContent = t('checkmate');
        statusText.style.color = 'var(--red-glow)';
      } else if (isStalemate(state.position)) {
        statusText.textContent = t('stalemate');
      } else if (isInCheck) {
        statusText.textContent = t('check');
        statusText.style.color = 'var(--red-glow)';
      } else {
        statusText.textContent = turn === 'w' ? t('whiteTurn') : t('blackTurn');
        statusText.style.color = 'var(--white-soft)';
      }
    }

    /* ==================== تحديث سجل النقلات ==================== */
    function updateMoveList() {
      moveListEl.innerHTML = '';
      for (let i = 0; i < state.moveHistory.length; i += 2) {
        const row = document.createElement('div');
        row.className = 'move-row';
        const num = Math.floor(i / 2) + 1;
        const whiteMove = state.moveHistory[i] || '';
        const blackMove = state.moveHistory[i + 1] || '';
        row.innerHTML = `<span class="move-num">${num}.</span><span class="move-san">${whiteMove}</span><span class="move-san">${blackMove}</span>`;
        moveListEl.appendChild(row);
      }
      moveListEl.scrollTop = moveListEl.scrollHeight;
    }

    /* ==================== تحديث الإحصائيات ==================== */
    function updateStats() {
      statMoves.textContent = state.moveCount;
      statPosition.textContent = state.positionId;
      document.getElementById('statsTotal').textContent = state.moveCount;
      document.getElementById('statsWhite').textContent = state.whiteMoves;
      document.getElementById('statsBlack').textContent = state.blackMoves;
    }

    /* ==================== التحقق من نهاية اللعبة ==================== */
    function checkGameOver(pos) {
      if (isCheckmate(pos)) {
        state.gameOver = true;
        const turn = getTurn(pos);
        const winner = turn === 'w' ? 'black' : 'white';
        gameOverTitle.textContent = t('checkmate');
        gameOverSub.textContent = winner === 'white' ? t('whiteWins') : t('blackWins');
        gameOverScreen.classList.add('active');
      } else if (isStalemate(pos)) {
        state.gameOver = true;
        gameOverTitle.textContent = t('stalemate');
        gameOverSub.textContent = t('draw');
        gameOverScreen.classList.add('active');
      }
    }

    /* ==================== لعبة جديدة ==================== */
    function newGame(fen) {
      let newFen = fen;
      if (!newFen) {
        // توليد موقع عشوائي 960
        newFen = randomChess960Fen();
      }
      state.fen = newFen;
      state.position = fromFen(newFen);
      state.history = [newFen];
      state.moveHistory = [];
      state.selectedSquare = null;
      state.legalMoves = [];
      state.lastMove = null;
      state.gameOver = false;
      state.moveCount = 0;
      state.whiteMoves = 0;
      state.blackMoves = 0;
      state.positionId = 0; // يمكن حسابه من FEN إذا لزم الأمر

      gameOverScreen.classList.remove('active');
      renderBoard();
      updateStatus();
      updateMoveList();
      updateStats();

      // تحديث رقم الموقع إذا كان FEN ناتجًا عن chess960StartingFen
      // يمكن محاولة استخراج الرقم من FEN، لكن نتركه 0 للعشوائي
    }

    /* ==================== تحميل موقع محدد ==================== */
    function loadPositionById(id) {
      if (id < 0 || id > 959) return;
      const fen = chess960StartingFen(id);
      state.positionId = id;
      newGame(fen);
    }

    /* ==================== الأصوات ==================== */
    function playMoveSound() {
      try {
        const ctx = new (window.AudioContext || window.webkitAudioContext)();
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.connect(gain);
        gain.connect(ctx.destination);
        osc.frequency.value = 600;
        gain.gain.setValueAtTime(0.1, ctx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.1);
        osc.start();
        osc.stop(ctx.currentTime + 0.1);
      } catch (e) { /* تجاهل */ }
    }

    /* ==================== ربط الأحداث ==================== */
    document.getElementById('btnNewGame').addEventListener('click', () => newGame());
    document.getElementById('btnNewRandom').addEventListener('click', () => newGame());
    document.getElementById('btnPlayAgain').addEventListener('click', () => newGame());

    document.getElementById('btnFlip').addEventListener('click', () => {
      state.orientation = state.orientation === 'white' ? 'black' : 'white';
      renderBoard();
    });

    document.getElementById('btnUndo').addEventListener('click', undoMove);

    // الإعدادات
    document.getElementById('btnSettings').addEventListener('click', () => {
      document.getElementById('settingsModal').classList.add('active');
    });
    document.getElementById('btnCloseSettings').addEventListener('click', () => {
      document.getElementById('settingsModal').classList.remove('active');
    });

    // الإحصائيات
    document.getElementById('btnStats').addEventListener('click', () => {
      document.getElementById('statsModal').classList.add('active');
    });
    document.getElementById('btnCloseStats').addEventListener('click', () => {
      document.getElementById('statsModal').classList.remove('active');
    });

    // تبديل اللغة
    document.getElementById('langToggle').addEventListener('click', function() {
      this.classList.toggle('on');
      state.lang = this.classList.contains('on') ? 'ar' : 'en';
      updateI18n();
    });

    // تبديل الصوت
    document.getElementById('soundToggle').addEventListener('click', function() {
      this.classList.toggle('on');
      state.soundEnabled = this.classList.contains('on');
    });

    // تحميل موقع برقم
    document.getElementById('btnLoadPos').addEventListener('click', () => {
      const id = parseInt(document.getElementById('posInput').value);
      if (!isNaN(id) && id >= 0 && id <= 959) {
        loadPositionById(id);
        document.getElementById('settingsModal').classList.remove('active');
      }
    });

    // إغلاق النوافذ عند النقر خارجها
    document.querySelectorAll('.modal-overlay').forEach(overlay => {
      overlay.addEventListener('click', (e) => {
        if (e.target === overlay) overlay.classList.remove('active');
      });
    });

    /* ==================== التهيئة ==================== */
    function init() {
      // بدء لعبة جديدة بموقع عشوائي 960
      newGame();
      updateI18n();
    }

    init();

    // كشف تغيير الحجم
    window.addEventListener('resize', () => {
      // إعادة رسم الرقعة للحفاظ على التناسب
      renderBoard();
    });

  </script>
